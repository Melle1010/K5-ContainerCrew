name: Deploy to Azure Container Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_ENVIRONMENT_NAME: ${{ vars.AZURE_ENVIRONMENT_NAME }}
      AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
      AZURE_KEYVAULT_NAME: ${{ vars.AZURE_KEYVAULT_NAME }}
      FRONTEND_APP_NAME: ${{ vars.FRONTEND_APP_NAME }}
      LLM_PROXY_APP_NAME: ${{ vars.LLM_PROXY_APP_NAME }}
      AI_CONTENT_APP_NAME: ${{ vars.AI_CONTENT_APP_NAME }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Create or update Azure resource group
        run: |
          az group create \
            --name "$AZURE_RESOURCE_GROUP" \
            --location "$AZURE_LOCATION"

      - name: Deploy Azure infrastructure
        run: |
          az deployment group create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters \
              environmentName="$AZURE_ENVIRONMENT_NAME" \
              containerRegistryName="$AZURE_ACR_NAME" \
              keyVaultName="$AZURE_KEYVAULT_NAME" \
              frontendAppName="$FRONTEND_APP_NAME" \
              llmProxyAppName="$LLM_PROXY_APP_NAME" \
              aiContentAppName="$AI_CONTENT_APP_NAME"

      - name: Build and push container images
        run: |
          ACR_LOGIN_SERVER=$(az acr show --name "$AZURE_ACR_NAME" --query loginServer -o tsv)

          az acr build --registry "$AZURE_ACR_NAME" --image "frontend:${GITHUB_SHA}" ./Frontend
          az acr build --registry "$AZURE_ACR_NAME" --image "llmproxy:${GITHUB_SHA}" ./Backend/LlmProxy
          az acr build --registry "$AZURE_ACR_NAME" --image "aicontent:${GITHUB_SHA}" ./Backend/AiContent

          echo "ACR_LOGIN_SERVER=$ACR_LOGIN_SERVER" >> "$GITHUB_ENV"

      - name: Update frontend image
        run: |
          az containerapp update \
            --name "$FRONTEND_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$ACR_LOGIN_SERVER/frontend:${GITHUB_SHA}"

      - name: Update LLM Proxy image
        run: |
          az containerapp update \
            --name "$LLM_PROXY_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$ACR_LOGIN_SERVER/llmproxy:${GITHUB_SHA}"

      - name: Update AI Content image
        run: |
          az containerapp update \
            --name "$AI_CONTENT_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$ACR_LOGIN_SERVER/aicontent:${GITHUB_SHA}"
