services:
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    restart: unless-stopped

  llmproxy:
    build:
      context: .
      dockerfile: Backend/LlmProxy/Dockerfile
    env_file:
      - .env
    ports:
      - "5188:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Container
      Gemini__ApiKey: ${GEMINI_API_KEY}
    restart: unless-stopped

  aicontent:
    build:
      context: .
      dockerfile: Backend/AiContent/Dockerfile
    env_file:
      - .env
    ports:
      - "5292:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Container
      LlmProxy__BaseUrl: http://llmproxy:8080/
      ServiceB__ApiKey: ${SECRET_API_KEY}
    depends_on:
      - llmproxy
    restart: unless-stopped
